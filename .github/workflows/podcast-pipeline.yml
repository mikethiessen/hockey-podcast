name: Podcast Pipeline

on:
  schedule:
    - cron: "0 * * * *"  # hourly backup net — real-time triggering comes from an
                          # external poller (cron-job.org) hitting workflow_dispatch every 1 min
  workflow_dispatch:
    inputs:
      game_id:
        description: "Game ID to manually generate an episode for (optional)"
        required: false
        default: ""
      force:
        description: "Regenerate even if this game_id already has episode_generated=true (use only for intentional redo)"
        required: false
        default: "false"
      skip_upload:
        description: "Test mode: generate real script + audio but don't upload to Buzzsprout, and don't mark episode_generated or advance any cadence/cooldown state. Download the result from this run's artifacts."
        required: false
        default: "false"

# Serialize all runs of this workflow. Without this, the 1-min poller can fire a new
# run before a prior run finishes writing episode_generated=true back to schedule.json
# (script + audio + upload can take several minutes) — every overlapping run then sees
# the same game as "not yet processed" and independently generates a duplicate episode.
# cancel-in-progress is false so we queue rather than kill an in-flight generation run.
concurrency:
  group: podcast-pipeline
  cancel-in-progress: false

jobs:
  check-for-game:
    name: Check for completed game
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.result.outputs.found }}
      game_id: ${{ steps.result.outputs.game_id }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Handle manual game_id override
        # Manual dispatch used to always set found=true unconditionally, bypassing the
        # episode_generated check entirely. That's how a single game_id ended up with
        # multiple full episodes generated back-to-back: someone (or a re-triggered
        # poller call) re-ran the workflow with the same game_id after it had already
        # succeeded, and this step never checked whether it needed to. Now it checks
        # schedule.json first and only proceeds if the episode isn't already generated,
        # unless `force: true` is explicitly passed for an intentional redo, or
        # `skip_upload: true` (test mode) — test runs never touch schedule.json or any
        # cadence/cooldown state, so re-running one is always safe regardless of
        # whether a real episode already exists for this game_id.
        if: ${{ github.event.inputs.game_id != '' }}
        id: check
        run: |
          GAME_ID="${{ github.event.inputs.game_id }}"
          FORCE="${{ github.event.inputs.force }}"
          SKIP_UPLOAD="${{ github.event.inputs.skip_upload }}"
          ALREADY_GENERATED=$(python3 -c "
          import json
          try:
              with open('data/schedule.json') as f:
                  schedule = json.load(f)
              game = next((g for g in schedule['games'] if g['game_id'] == '$GAME_ID'), None)
              print('true' if game and game.get('episode_generated') else 'false')
          except Exception:
              print('false')
          ")
          if [ "$ALREADY_GENERATED" = "true" ] && [ "$FORCE" != "true" ] && [ "$SKIP_UPLOAD" != "true" ]; then
            echo "Episode already generated for game $GAME_ID — skipping. Pass force=true to regenerate for real, or skip_upload=true to test without affecting the real state."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "game_id=$GAME_ID" >> $GITHUB_OUTPUT
          fi

      - name: Sync schedule and check for completed game
        if: ${{ github.event.inputs.game_id == '' }}
        id: auto_check
        run: |
          python scripts/sync_schedule.py
          python scripts/check_schedule.py
        continue-on-error: true

      - name: Set found=false if no game found
        if: ${{ github.event.inputs.game_id == '' && steps.auto_check.outcome == 'failure' }}
        run: echo "found=false" >> $GITHUB_OUTPUT

      - name: Determine result
        id: result
        # steps.check only runs on manual override; steps.auto_check only runs on
        # auto-detect. This step always runs and picks up whichever one actually
        # set outputs, so job-level outputs work correctly on BOTH paths.
        # (Previously the job outputs pointed only at steps.check, which meant
        # auto-detected runs could never report found=true, no matter what
        # check_schedule.py found.)
        run: |
          echo "found=${{ steps.check.outputs.found || steps.auto_check.outputs.found || 'false' }}" >> $GITHUB_OUTPUT
          echo "game_id=${{ steps.check.outputs.game_id || steps.auto_check.outputs.game_id || '' }}" >> $GITHUB_OUTPUT

      - name: Commit synced schedule
        # This job and generate-episode each start from their own fresh checkout —
        # nothing this job does to schedule.json is visible to generate-episode's
        # commit step unless it's pushed here first. Without this, every game
        # sync_schedule.py discovers (aside from the one game_id actually processed
        # this run) is silently discarded when the runner is torn down.
        if: ${{ github.event.inputs.game_id == '' }}
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add data/schedule.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync schedule: pick up newly discovered games"
            git push
          fi

  generate-episode:
    name: Generate episode
    runs-on: ubuntu-latest
    needs: check-for-game
    if: needs.check-for-game.outputs.found == 'true'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y ffmpeg

      - name: Generate script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_MODE: ${{ github.event.inputs.skip_upload }}
        run: python scripts/generate_script.py ${{ needs.check-for-game.outputs.game_id }}

      - name: Generate audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/generate_audio.py ${{ needs.check-for-game.outputs.game_id }}

      - name: Upload to Buzzsprout
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        env:
          BUZZSPROUT_API_TOKEN: ${{ secrets.BUZZSPROUT_API_TOKEN }}
          BUZZSPROUT_PODCAST_ID: ${{ secrets.BUZZSPROUT_PODCAST_ID }}
        run: python scripts/upload_episode.py ${{ needs.check-for-game.outputs.game_id }}

      - name: Upload test artifacts (skip_upload only)
        if: ${{ github.event.inputs.skip_upload == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-episode-${{ needs.check-for-game.outputs.game_id }}
          path: |
            data/episodes/${{ needs.check-for-game.outputs.game_id }}/script.txt
            data/episodes/${{ needs.check-for-game.outputs.game_id }}/episode.mp3
          retention-days: 14

      - name: Commit updated data back to repo
        # Skipped entirely in test mode (skip_upload=true) — nothing was written to
        # schedule.json or any cadence/cooldown log by generate_script.py's TEST_MODE
        # guard, and the generated script/audio for a test run should never be
        # committed to the repo. The download link is the "Upload test artifacts"
        # step above instead.
        #
        # This is the step that previously could fail silently-ish: the episode is
        # already generated and uploaded to Buzzsprout by this point, so if the push
        # here fails and nothing retries it, episode_generated=true never reaches the
        # repo. The game then still looks "not yet processed" to the next run (auto or
        # manual), which regenerates and re-uploads a full duplicate episode. This is
        # exactly what happened on 2026-09-08. Retrying with a rebase handles transient
        # push failures; if it still can't push after retrying, fail loudly instead of
        # silently losing the flag.
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Generated episode for game ${{ needs.check-for-game.outputs.game_id }}"

          branch=$(git symbolic-ref --short HEAD)
          max_attempts=5
          attempt=1
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Failed to push after $max_attempts attempts. The episode for game ${{ needs.check-for-game.outputs.game_id }} was already generated and uploaded to Buzzsprout, but data/schedule.json's episode_generated flag was NOT saved to the repo. To avoid a duplicate episode, manually set episode_generated=true for this game_id in data/schedule.json before the next run — do NOT re-run this workflow with the game_id to 'finish the job'."
              exit 1
            fi
            echo "Push failed (attempt $attempt/$max_attempts). Fetching and rebasing before retry..."
            sleep $((attempt * 5))
            git fetch origin "$branch"
            git rebase "origin/$branch" || { echo "::error::Rebase failed during retry."; git rebase --abort; exit 1; }
            attempt=$((attempt + 1))
          done
          echo "Push succeeded."

