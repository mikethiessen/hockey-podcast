name: probe-opponent-stats
on:
  push:
    branches: [claude/opponent-stats-probe]
    paths: ['probe/probe.mjs', '.github/workflows/probe-opponent-stats.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node probe/probe.mjs
      - run: |
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git add -f probe/out && git commit -m "Probe output" && git push
