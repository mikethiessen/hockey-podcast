name: verify-opponent-stats
on:
  push:
    branches: [claude/opponent-season-stats]
    paths: ['scripts/opponent_stats.py', '.github/workflows/verify-opponent-stats.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: |
          mkdir -p verify_out
          python - <<'PY' > verify_out/result.txt 2>&1
          import sys, json
          sys.path.insert(0, "scripts")
          import opponent_stats as o
          sid = o._schedule_id()
          div = o._fetch_division_games(sid)
          print("division games:", len(div), "finals:", sum(1 for g in div if g.get("game_status_id")==9))
          names = sorted({(g[s] or {}).get("name") for g in div for s in ("homeTeam","visitingTeam")})
          print("teams:", names)
          for n in names:
              if n and n != "Village People":
                  print("-----"); print(o.build_opponent_context(n, "preview"))
          PY
      - run: |
          git config user.name "verify-bot"; git config user.email "verify@users.noreply.github.com"
          git add -f verify_out && git commit -m "Verify output" && git push
