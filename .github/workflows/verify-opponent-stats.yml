name: verify-opponent-stats
on:
  push:
    branches: [claude/opponent-season-stats]
    paths: ['scripts/opponent_stats.py', '.github/workflows/verify-opponent-stats.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: |
          mkdir -p verify_out
          python - <<'PY' > verify_out/result.txt 2>&1
          import sys, json
          sys.path.insert(0, "scripts")
          import opponent_stats as o
          sid = o._schedule_id()
          ours = o._fetch_games(sid, o.OUR_TEAM_ID)
          print("our games:", len(ours))
          opps = []
          for g in ours:
              for s in ("homeTeam","visitingTeam"):
                  n = g[s]["name"]
                  if n != "Village People" and n not in opps: opps.append(n)
          print("opponents:", opps)
          for n in opps:
              print("-----"); print(o.build_opponent_context(n, "preview"))
          PY
      - run: |
          git config user.name "verify-bot"; git config user.email "verify@users.noreply.github.com"
          git add -f verify_out && git commit -m "Verify output" && git pull --rebase origin claude/opponent-season-stats && git push
